[project]
name = "serial-writer"
version = "0.1.0"
description = "Agentic serial story writer: a 200-episode story with a human in the loop"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "openai>=1.40",
  "typer>=0.12",
  "click>=8.1",
  "rich>=13",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
story = "serial_writer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["serial_writer"]

[tool.setuptools.package-data]
serial_writer = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
